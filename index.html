<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Guest List: the wedding guest list that grows a wreath</title>
  <meta name="description" content="Type a name or paste your whole WhatsApp list. Every guest grows a leaf on your wreath, the count stays on top, and one tap gives you a beautiful PDF.">
  <meta name="theme-color" content="#0f2119">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Guest List">
  <meta property="og:description" content="The wedding guest list that grows a wreath. Add, edit, and download as a PDF.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preload" href="/fonts/cormorant.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="bar" id="bar" aria-hidden="true">
    <div class="bar-count"><span class="odo" id="miniCount"></span> <span id="miniLabel">guests</span></div>
    <button class="btn btn-gold btn-small js-download" type="button" tabindex="-1">Download PDF</button>
  </div>

  <header class="hero" id="hero">
    <p class="save" id="save" role="status" hidden><span class="save-dot" aria-hidden="true"></span><span id="saveText"></span></p>
    <input class="hero-names" id="names" type="text" maxlength="80" placeholder="Your names" aria-label="The couple's names" autocomplete="off">
    <label class="hero-date" id="dateWrap">
      <span id="dateText">Add your date</span>
      <input id="date" type="date" aria-label="Wedding date">
    </label>

    <div class="wreath" id="wreath">
      <div class="count">
        <div class="count-number" id="countNumber"><span class="odo" id="bigCount" aria-hidden="true"></span></div>
        <div class="count-label" id="countLabel">guests</div>
        <button class="limit" id="limitBtn" type="button">set a seat limit</button>
        <input class="limit-input" id="limitInput" type="number" inputmode="numeric" min="1" max="100000" placeholder="Seats" aria-label="Number of seats" hidden>
      </div>
    </div>

    <p class="tally" id="tally"></p>
    <div class="hero-actions">
      <button class="btn btn-gold js-download" type="button">Download PDF</button>
      <button class="btn btn-ghost" id="upload" type="button">Upload PDF</button>
    </div>
  </header>

  <div class="dock" id="dock">
    <div class="magic" id="magic">
      <textarea id="magicInput" rows="1" enterkeyhint="done" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Add guests, or search your list" placeholder="Type a name, or paste your whole list"></textarea>
      <button class="magic-action" id="magicAction" type="button" aria-label="Add guest"></button>
    </div>
    <div class="preview" id="preview" aria-live="polite"></div>
  </div>

  <main class="sheet">
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty">
      <p class="empty-lead">One leaf for every guest.</p>
      <p class="empty-sub">Try one of these, or paste your whole WhatsApp list.</p>
      <div class="empty-tries">
        <button type="button" class="try">Mr &amp; Mrs Johnson +2</button>
        <button type="button" class="try">The Bello family of 5, table 3</button>
        <button type="button" class="try">Ṣadé Adéyẹmí (vegan)</button>
      </div>
      <button type="button" class="empty-upload" id="uploadEmpty">Have a PDF from here? Upload it to keep editing</button>
    </div>
  </main>

  <footer class="foot" id="foot">
    <button class="foot-link" id="share" type="button">Share this list</button>
    <button class="foot-link" id="reset" type="button">Start a new list</button>
    <p class="foot-note" id="footNote">Saved on this device. It goes online as soon as it can.</p>
  </footer>

  <input type="file" id="fileInput" accept="application/pdf,.pdf,text/plain,.txt,text/csv,.csv" hidden>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toastText"></span>
    <button id="toastUndo" type="button" hidden>Undo</button>
  </div>
  <div class="sr-only" id="live" aria-live="polite"></div>
</body>
</html>
